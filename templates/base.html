{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Система управления заявками{% endblock %}</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственный CSS -->
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body class="bg-light">
    <!-- Навигация -->
    {% include "includes/navigation.html" %}

    <main class="container mt-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Подвал -->
    <footer class="container mt-5 mb-3 text-muted text-center border-top pt-3">
        <p>© <span id="current-year"></span> ЖКХ-Сервис</p>
    </footer>

    <!-- JavaScript -->
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
