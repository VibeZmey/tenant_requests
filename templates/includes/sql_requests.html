<table class="table table-striped"><thead><tr><th>№</th><th>Жилец / квартира</th><th>Проблема</th><th>Дата</th><th>Категория</th><th>Статус</th><th>Исполнитель</th></tr></thead><tbody>
{% for r in requests %}<tr><td><a href="{% url 'requests:request_detail' r.id %}">{{ r.id }}</a></td><td><a href="{% url 'tenants:tenant_detail' r.tenant_id %}">{{ r.tenant_name }}</a> / {{ r.flat }}</td><td>{{ r.problem }}</td><td>{{ r.date }}</td><td>{{ r.category }}</td><td>{{ r.status }}</td><td>{% if r.executor_id %}<a href="{% url 'executors:executor_detail' r.executor_id %}">{{ r.executor_name }}</a>{% else %}Не назначен{% endif %}</td></tr>{% empty %}<tr><td colspan="7">Заявки не найдены.</td></tr>{% endfor %}</tbody></table>
